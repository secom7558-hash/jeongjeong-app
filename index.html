<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정정 업무요청">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4e79">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정정 업무요청</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#111;--mute:#5b6774;--line:#cfd6dd;--head:#eef4fa;--acc:#1f4e79;--accink:#fff;--ok:#1f7a45;--wait:#b4410f;--bad:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:17px;padding-bottom:84px}
.mock{background:#fff3cd;color:#000;font-size:13px;text-align:center;padding:5px 8px;border-bottom:1px solid #e6d28a}
header{background:var(--acc);color:#fff;padding:14px 16px;font-weight:700;font-size:18px;text-align:center}
main{max-width:560px;margin:0 auto;padding:12px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
label.f{display:block;font-weight:700;font-size:15px;margin:12px 0 5px}
label.f:first-child{margin-top:0}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
textarea{min-height:92px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#place{grid-template-columns:repeat(5,1fr);gap:6px}#place button{padding:14px 2px}
.seg button{font:inherit;font-weight:700;padding:14px 4px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:56px;line-height:1.25}
.seg button small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--head)}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:16px}
.chk input{width:24px;height:24px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:12px 14px;min-height:48px;width:100%}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-size:19px;min-height:56px}
.btn.sm{width:auto;min-height:40px;padding:8px 12px;font-size:15px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#ddd}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:16px;display:grid;place-items:center}
.cnt{font-weight:400;color:var(--mute);font-size:14px}
.err{color:var(--bad);font-weight:700;font-size:15px;margin:8px 0 0;min-height:1.2em}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom)}
nav button{font:inherit;font-weight:700;border:0;background:#fff;padding:16px 4px;font-size:16px;color:var(--mute)}
nav button[aria-selected="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.rec .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;font-size:14px;color:var(--mute)}
.rec .ct{font-weight:700;margin:2px 0 4px;white-space:pre-line}
.rec .who{font-size:14px;color:var(--mute)}
.badge{font-size:13px;font-weight:700;border-radius:20px;padding:3px 10px;border:1px solid}
.badge.w{color:var(--wait);border-color:var(--wait)}
.badge.o{color:var(--ok);border-color:var(--ok)}
.badge.c{color:var(--mute);border-color:var(--mute)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts .btn{min-height:44px;font-size:15px}
.acts .del{color:var(--bad)}
.rec{padding:0;overflow:hidden}
.rec .hd{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;padding:11px 12px;cursor:pointer}
.rec .hd .l1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.rec .hd .l2{margin-top:4px;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .hd .l2 em{font-style:normal;font-weight:400;color:var(--mute)}
.rec .hd .l1 .r{display:flex;align-items:center;gap:6px}
.rec .hd .arw{font-size:12px;color:var(--mute)}
.rec .bd{padding:0 12px 12px;border-top:1px dashed var(--line)}
.rec .bd .ct{margin-top:10px}
.more{margin:4px 0 12px}
.cntline{text-align:center;color:var(--mute);font-size:13px;margin:0 0 8px}
.hint{font-size:13px;color:var(--mute);margin:0 0 10px;text-align:center}
.editbar{background:#fff3cd;border:1px solid #e6d28a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;color:var(--mute);font-weight:400}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.row3 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.lab{font-size:12.5px;color:var(--mute);margin-top:8px}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.filters.v3{grid-template-columns:repeat(3,1fr)}
.filters button{font:inherit;font-weight:700;font-size:14px;padding:10px 2px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.filters button small{display:block;font-weight:400;font-size:12px;opacity:.85}
.filters button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.ok{text-align:center;padding:30px 10px}
.ok .big{font-size:44px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
dialog{border:0;border-radius:12px;max-width:94vw;padding:0}
dialog img{display:block;max-width:94vw;max-height:80vh}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>정정 업무요청</header>


<main id="pgUp">
  <div id="formWrap">
    <div class="editbar" id="editbar" hidden><span>기록 수정 중</span><button type="button" class="btn sm" id="cancelEdit">수정 취소</button></div>
    <div class="card">
      <label class="f">작성자</label>
      <div class="seg" id="who">
        <button type="button" data-v="김재원 계장">김재원<small>계장</small></button>
        <button type="button" data-v="이종희 주임">이종희<small>주임</small></button>
        <button type="button" data-v="김건민 사원">김건민<small>사원</small></button>
      </div>
    </div>
    <div class="card">
      <label class="f">작업 시작</label>
      <div class="g2"><input type="date" id="sD"><select id="sT"></select></div>
      <label class="f">작업 완료 <span class="cnt">(진행 중이면 날짜를 지우세요)</span></label>
      <div class="g2"><input type="date" id="eD"><select id="eT"></select></div>
      <label class="f">요청자</label>
      <div class="g3"><select id="co"></select><input type="text" id="nm" placeholder="이름"><select id="ti"></select></div>
      <label class="f">장소 <span class="cnt">(해당하는 곳을 모두 누르세요)</span></label>
      <div class="seg" id="place">
        <button type="button" data-v="수직" aria-pressed="false">수직</button>
        <button type="button" data-v="수평" aria-pressed="false">수평</button>
        <button type="button" data-v="열처리" aria-pressed="false">열처리</button>
        <button type="button" data-v="축로" aria-pressed="false">축로</button>
        <button type="button" data-v="기타" aria-pressed="false">기타</button>
      </div>
      <input type="text" id="detail" placeholder="자세한 장소 (예: 코팅장 앞)" style="margin-top:8px">
      <label class="f">작업 내용</label>
      <textarea id="content" placeholder="예: 용탕받이 보수, 난간대 용접"></textarea>
      <label class="chk"><input type="checkbox" id="rail"> 난간대 작업 <span class="cnt" id="railHint"></span></label>
    </div>
    <div class="card">
      <h3>작업 전 사진 <span class="cnt" id="cB">0/6</span></h3>
      <input type="file" id="fB" accept="image/*" multiple hidden>
      <button class="btn" type="button" id="addB">📷 사진 찍기 / 고르기</button>
      <div class="thumbs" id="tB"></div>
    </div>
    <div class="card">
      <h3>작업 후 사진 <span class="cnt" id="cA">0/6</span></h3>
      <input type="file" id="fA" accept="image/*" multiple hidden>
      <button class="btn" type="button" id="addA">📷 사진 찍기 / 고르기</button>
      <div class="thumbs" id="tA"></div>
    </div>
    <p class="err" id="err"></p>
    <button class="btn pri" id="send">올리기</button>
  </div>
  <div class="card ok" id="done" hidden>
    <div class="big">✅</div>
    <h3 style="font-size:19px" id="doneT">올렸습니다</h3>
    <p style="color:var(--mute)">확인 후 일지에 반영됩니다.<br>「내가 올린 기록」에서 볼 수 있습니다.</p>
    <button class="btn pri" id="again">새 작업 올리기</button>
  </div>
</main>

<main id="pgMine" hidden>
  <div class="filters" id="flt">
    <button data-v="" aria-pressed="true">전체</button>
    <button data-v="김재원 계장" aria-pressed="false">김재원<small>계장</small></button>
    <button data-v="이종희 주임" aria-pressed="false">이종희<small>주임</small></button>
    <button data-v="김건민 사원" aria-pressed="false">김건민<small>사원</small></button>
    <button data-v="이전 기록" aria-pressed="false">이전<small>기록</small></button>
  </div>
  <div class="filters v3" id="vw">
    <button data-v="" aria-pressed="true">모두</button>
    <button data-v="wip" aria-pressed="false">미처리<small id="nWip"></small></button>
    <button data-v="rail" aria-pressed="false">난간대<small id="nRail"></small></button>
  </div>
  <select id="mon" style="width:100%;margin-bottom:10px"></select>
  <p class="hint" id="listHint"></p>
  <button class="btn" id="reload" style="margin-bottom:12px">🔄 새로고침</button>
  <div id="list"></div>
</main>

<main id="pgRes" hidden>
  <div class="editbar"><span>작업 결과 올리기</span><button type="button" class="btn sm" id="resCancel">취소</button></div>
  <div class="card"><div id="resInfo" style="font-size:15px;line-height:1.5"></div></div>
  <div class="card">
    <label class="f">작업 완료</label>
    <div class="g2"><input type="date" id="rD"><select id="rT"></select></div>
    <label class="f">결과 메모 <span class="cnt">(선택)</span></label>
    <textarea id="rNote" placeholder="예: 용접 보수 완료, 도장 필요"></textarea>
  </div>
  <div class="card">
    <h3>작업 후 사진 <span class="cnt" id="cR">0/6</span></h3>
    <input type="file" id="fR" accept="image/*" multiple hidden>
    <button class="btn" type="button" id="addR">📷 사진 찍기 / 고르기</button>
    <div class="thumbs" id="tR"></div>
  </div>
  <p class="err" id="errR"></p>
  <button class="btn pri" id="resSend">결과 올리기</button>
</main>

<nav id="nav">
  <button data-p="pgUp" aria-selected="true">작업 올리기</button>
  <button data-p="pgMine" aria-selected="false">내가 올린 기록</button>
</nav>
<dialog id="dlg"><img id="big" alt="사진"></dialog>

<script>
var SUPA='https://yszclwgnkkqlhvgempbe.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzemNsd2dua2txbGh2Z2VtcGJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODMwMzMsImV4cCI6MjEwNzQ1OTAzM30.YonB7C62zQQx1cZkvS_A__OgNEV7qR0sQnohVB2rkhc';
var MAX=6,CO=['현대제철','현대아이엠씨'],TI=['기장','계장','주임','사원','매니저','책임 매니저'];
var who='',B=[],A=[],rows=[],editing=null,orig=[],busy=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function today(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function r10(d){var m=Math.round(d.getMinutes()/10)*10,x=new Date(d);x.setMinutes(m,0,0);return x}
var T10=[];for(var h=0;h<24;h++)for(var m=0;m<60;m+=10)T10.push(pad(h)+':'+pad(m));
function timeOpts(sel,v){var l=T10.slice();if(v&&l.indexOf(v)<0){l.push(v);l.sort()}sel.innerHTML=l.map(function(t){return '<option'+(t===v?' selected':'')+'>'+t+'</option>'}).join('')}
function nowT(){var d=r10(new Date());return pad(d.getHours())+':'+pad(d.getMinutes())}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- 서버 통신 ---------- */
function H(extra){var h={apikey:KEY,Authorization:'Bearer '+KEY};for(var k in extra)h[k]=extra[k];return h}
function api(path,opt){opt=opt||{};opt.headers=H(opt.headers);
  return fetch(SUPA+path,opt).then(function(r){
    if(!r.ok)return r.text().then(function(t){var e=new Error(t||r.status);e.status=r.status;throw e});
    return r.status===204?null:r.json().catch(function(){return null})})}
function thumbP(p){return p.replace(/\.jpg$/,'_t.jpg')}
function pubUrl(p){return SUPA+'/storage/v1/object/public/photos/'+p.split('/').map(encodeURIComponent).join('/')}
function upload(path,dataUrl){return fetch(dataUrl).then(function(r){return r.blob()}).then(function(b){
  return fetch(SUPA+'/storage/v1/object/photos/'+path,{method:'POST',headers:H({'Content-Type':'image/jpeg','cache-control':'max-age=31536000'}),body:b}).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('사진 올리기 실패 '+t)})})})}
function removeFiles(paths){if(!paths.length)return Promise.resolve();
  var all=[];paths.forEach(function(p){all.push(p);all.push(thumbP(p))});
  return fetch(SUPA+'/storage/v1/object/photos',{method:'DELETE',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({prefixes:all})}).catch(function(){})}

/* ---------- 탭 ---------- */
function goTab(p){['pgUp','pgMine','pgRes'].forEach(function(x){$(x).hidden=x!==p});
  [].forEach.call($('nav').children,function(x){x.setAttribute('aria-selected',x.dataset.p===p?'true':'false')});
  if(p==='pgMine')loadList(true);window.scrollTo(0,0)}
$('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)goTab(b.dataset.p)});

/* ---------- 입력 ---------- */
function fillSel(sel,arr,ph){sel.innerHTML='<option value="">'+ph+'</option>'+arr.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')}
function setWho(v){who=v;lsSet('jr-who',v);[].forEach.call($('who').children,function(x){x.setAttribute('aria-pressed',x.dataset.v===v?'true':'false')})}
function setPlaces(l){[].forEach.call($('place').children,function(b){b.setAttribute('aria-pressed',l.indexOf(b.dataset.v)>=0?'true':'false')})}
function initForm(){
  fillSel($('co'),CO,'회사');fillSel($('ti'),TI,'직책');
  $('sD').value=today();timeOpts($('sT'),nowT());$('eD').value=today();timeOpts($('eT'),nowT());
}
$('who').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setWho(b.dataset.v)});
$('place').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')});
function places(){return [].filter.call($('place').children,function(b){return b.getAttribute('aria-pressed')==='true'}).map(function(b){return b.dataset.v})}
/* 작업 내용에 난간/난간대가 들어가면 아래 칸 자동 체크 (직접 끄면 그 글에서는 다시 켜지 않음) */
var autoRail=false,manualOff=false;
function railSync(){
  var has=/난간/.test($('content').value);
  if(has&&!manualOff&&!$('rail').checked){$('rail').checked=true;autoRail=true}
  if(!has){manualOff=false;if(autoRail&&$('rail').checked)$('rail').checked=false;autoRail=false}
  $('railHint').textContent=(autoRail&&$('rail').checked)?'(자동 체크됨)':''}
$('content').addEventListener('input',railSync);
$('rail').addEventListener('change',function(){
  autoRail=false;manualOff=!$('rail').checked&&/난간/.test($('content').value);$('railHint').textContent=''});

/* 사진: 큰 사진(긴 변 1200px)과 작은 미리보기(긴 변 320px) 두 장으로 줄이기 */
function shrink(file){return new Promise(function(res,rej){
  var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
    function mk(L,q){var s=Math.min(1,L/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',q)}
    res({d:mk(1200,.75),t:mk(320,.7),p:null})};im.src=r.result};r.readAsDataURL(file)})}
function src(it){return it.t||(it.p?pubUrl(thumbP(it.p)):it.d)}
function bindPics(btn,inp,arr,box,cnt,label,eid){
  var E=function(){return $(eid||'err')};
  btn.onclick=function(){inp.click()};
  inp.onchange=function(){
    var files=[].slice.call(inp.files),room=MAX-arr.length;inp.value='';
    if(files.length>room){E().textContent=label+' 사진은 '+MAX+'장까지 올릴 수 있습니다. '+room+'장만 추가했습니다.';files=files.slice(0,room)}else E().textContent='';
    Promise.all(files.map(shrink)).then(function(l){l.forEach(function(d){arr.push(d)});draw()}).catch(function(){E().textContent='사진을 읽지 못했습니다. 다시 골라 주세요.'})};
  function draw(){
    box.innerHTML=arr.map(function(d,i){return '<div class="th"><img src="'+src(d)+'" data-i="'+i+'" alt="사진"><b data-i="'+i+'" aria-label="사진 지우기">✕</b></div>'}).join('');
    cnt.textContent=arr.length+'/'+MAX;btn.disabled=arr.length>=MAX}
  box.addEventListener('click',function(e){var x=e.target.closest('b');if(x){arr.splice(+x.dataset.i,1);draw();return}
    var im=e.target.closest('img');if(im){var it=arr[+im.dataset.i];openBig(it.d||pubUrl(it.p))}});
  arr.draw=draw;draw()}
function openBig(u){$('big').src=u;$('dlg').showModal()}
initForm();
bindPics($('addB'),$('fB'),B,$('tB'),$('cB'),'작업 전');
bindPics($('addA'),$('fA'),A,$('tA'),$('cA'),'작업 후');
var R=[],resRow=null,resBusy=false;
bindPics($('addR'),$('fR'),R,$('tR'),$('cR'),'작업 후','errR');
$('dlg').addEventListener('click',function(){$('dlg').close()});

function clearForm(){
  B.length=0;A.length=0;B.draw();A.draw();orig=[];
  ['nm','detail','content'].forEach(function(i){$(i).value=''});$('co').value='';$('ti').value='';
  $('rail').checked=false;autoRail=false;manualOff=false;$('railHint').textContent='';setPlaces([]);$('err').textContent='';
  editing=null;$('editbar').hidden=true;$('send').textContent='올리기';initForm()}
function split(t){return t?[t.slice(0,10),t.slice(11,16)]:['',nowT()]}
function loadForm(r){
  clearForm();editing=r.id;setWho(r.writer);
  var s=split(r.started_at),e=r.ended_at?split(r.ended_at):['',nowT()];
  $('sD').value=s[0];timeOpts($('sT'),s[1]);$('eD').value=e[0];timeOpts($('eT'),e[1]);
  $('co').value=r.co;$('nm').value=r.nm;$('ti').value=r.ti;setPlaces(r.places);
  $('detail').value=r.detail||'';$('content').value=r.content;$('rail').checked=!!r.rail;
  r.before_photos.forEach(function(p){B.push({p:p})});r.after_photos.forEach(function(p){A.push({p:p})});B.draw();A.draw();
  orig=r.before_photos.concat(r.after_photos);
  $('editbar').hidden=false;$('send').textContent='수정해서 올리기';
  $('formWrap').hidden=false;$('done').hidden=true}

function fail(msg){$('err').textContent=msg;busy=false;$('send').disabled=false;$('send').textContent=editing?'수정해서 올리기':'올리기'}
$('send').onclick=function(){
  if(busy)return;
  var m=[];
  if(!who)m.push('작성자');if(!$('co').value||!$('nm').value.trim())m.push('요청자(회사·이름)');
  if(!places().length)m.push('장소');if(!$('content').value.trim())m.push('작업 내용');
  if(!B.length)m.push('작업 전 사진');
  if($('eD').value&&!A.length)m.push('작업 후 사진');
  if(m.length){$('err').textContent='빠진 곳: '+m.join(', ');window.scrollTo(0,document.body.scrollHeight);return}
  busy=true;$('send').disabled=true;$('send').textContent='올리는 중… (창을 닫지 마세요)';$('err').textContent='';
  var id=editing||crypto.randomUUID(),wasEdit=editing!==null;
  var all=B.concat(A),todo=all.filter(function(it){return !it.p});
  var n=0;
  /* 새 사진 올리기 (한 장씩, 실패하면 그 자리에서 멈추고 다시 누르면 이어서 올림) */
  var chain=todo.reduce(function(pr,it){return pr.then(function(){
    var p=id+'/'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36)+'.jpg';
    return upload(p,it.d).then(function(){return upload(thumbP(p),it.t)}).then(function(){it.p=p;n++;$('send').textContent='올리는 중… '+n+'/'+todo.length})})},Promise.resolve());
  chain.then(function(){
    var row={writer:who,started_at:$('sD').value+'T'+$('sT').value+':00',ended_at:$('eD').value?$('eD').value+'T'+$('eT').value+':00':null,
      co:$('co').value,nm:$('nm').value.trim(),ti:$('ti').value,places:places(),detail:$('detail').value.trim(),
      content:$('content').value.trim(),rail:$('rail').checked,
      before_photos:B.map(function(x){return x.p}),after_photos:A.map(function(x){return x.p})};
    if(!wasEdit){row.id=id;return api('/rest/v1/requests',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)})}
    return api('/rest/v1/requests?id=eq.'+id+'&status=eq.wait',{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(row)}).then(function(r){
      if(!r||!r.length){var e=new Error('locked');e.locked=true;throw e}
      var keep=row.before_photos.concat(row.after_photos);return removeFiles(orig.filter(function(p){return keep.indexOf(p)<0}))})
  }).then(function(){
    lsSet('jr-who',who);
    $('doneT').textContent=wasEdit?'수정했습니다':'올렸습니다';
    busy=false;$('send').disabled=false;$('formWrap').hidden=true;$('done').hidden=false;window.scrollTo(0,0)
  }).catch(function(e){
    if(e&&e.locked)fail('이미 확인 중이거나 일지에 반영되어 고칠 수 없습니다.');
    else fail('올리지 못했습니다. 인터넷 연결을 확인하고 「올리기」를 다시 눌러 주세요. (사진은 이미 올라간 것부터 이어서 올립니다)')})};
$('again').onclick=function(){clearForm();setWho(who);$('formWrap').hidden=false;$('done').hidden=true};
$('cancelEdit').onclick=function(){clearForm();setWho(who);goTab('pgMine')};

/* ---------- 내가 올린 기록 ---------- */
var PAGE=20,flt='',view='',mon=today().slice(0,7),open_={},hasMore=false;
(function(){var d=new Date(),y=d.getFullYear(),m=d.getMonth()+1,h='<option value="">전체 기간</option>';
  while(y>2025||(y===2025&&m>=11)){var v=y+'-'+pad(m);h+='<option value="'+v+'"'+(v===mon?' selected':'')+'>'+y+'년 '+m+'월</option>';if(--m<1){m=12;y--}}
  $('mon').innerHTML=h})();
$('mon').onchange=function(){mon=$('mon').value;loadList()};
$('flt').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;flt=b.dataset.v;if(flt&&flt!=='이전 기록')setWho(flt);
  [].forEach.call($('flt').children,function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});loadList()});
$('reload').onclick=function(){loadList(true)};
function fmt(s){if(!s)return '';var d=s.slice(0,10).split('-');return +d[1]+'/'+(+d[2])+' '+s.slice(11,16)}
var BADGE={wait:['w','확인 대기'],chk:['c','확인 중'],done:['o','일지 반영']};
$('vw').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;view=b.dataset.v;if(view==='wip'){mon='';$('mon').value=''}
  [].forEach.call($('vw').children,function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});loadList()});
function q(n,off){return '/rest/v1/requests?select=*'+(flt?'&writer=eq.'+encodeURIComponent(flt):(view||mon?'':'&writer=neq.'+encodeURIComponent('이전 기록')))
  +(mon?'&started_at=gte.'+mon+'-01T00:00:00&started_at=lt.'+(function(){var y=+mon.slice(0,4),m=+mon.slice(5);if(++m>12){m=1;y++}return y+'-'+pad(m)})()+'-01T00:00:00':'')
  +(view==='wip'?'&ended_at=is.null':view==='rail'?'&rail=eq.true':'')
  +'&order=started_at.'+(view==='wip'?'asc':'desc')+',created_at.desc&limit='+(n+1)+'&offset='+off}
function loadCounts(){
  api('/rest/v1/requests?select=id&ended_at=is.null').then(function(r){$('nWip').textContent=(r||[]).length+'건'}).catch(function(){});
  api('/rest/v1/requests?select=id&rail=eq.true').then(function(r){$('nRail').textContent=(r||[]).length+'건'}).catch(function(){})}
/* keep=true: 지금 보이는 개수만큼 다시 불러옴(새로고침), false: 처음 20건 */
function loadList(keep){
  var n=keep?Math.max(PAGE,rows.length):PAGE;
  $('listHint').textContent='불러오는 중…';loadCounts();
  return api(q(n,0)).then(function(r){r=r||[];hasMore=r.length>n;rows=r.slice(0,n);renderList()})
    .catch(function(){$('listHint').textContent='';$('list').innerHTML='<div class="empty">불러오지 못했습니다.<br>인터넷 연결을 확인하고 「새로고침」을 눌러 주세요.</div>'})}
function loadMore(){
  var b=$('moreBtn');if(b){b.disabled=true;b.textContent='불러오는 중…'}
  api(q(PAGE,rows.length)).then(function(r){r=r||[];hasMore=r.length>PAGE;rows=rows.concat(r.slice(0,PAGE));renderList()})
    .catch(function(){if(b){b.disabled=false;b.textContent='불러오지 못했습니다. 다시 누르세요'}})}
function renderList(){
  $('listHint').textContent=view==='wip'?'아직 완료되지 않은 요청입니다. 오래된 순이며, 펼쳐서 「결과 올리기」를 누르세요.':view==='rail'?'난간대 작업 모음입니다.':flt==='이전 기록'?'업무홈 일지에 있던 이전 기록입니다. 보기만 할 수 있습니다.':who?'수정·삭제는 '+who+' 님이 올린 「확인 대기」 기록만 할 수 있습니다.':'수정·삭제하려면 위에서 본인 이름을 누르세요.';
  if(!rows.length){$('list').innerHTML='<div class="empty">올린 기록이 없습니다.</div>';return}
  var h='<p class="cntline">'+rows.length+'건'+(hasMore?' 표시 중':'')+' · 눌러서 펼치기</p>';
  h+=rows.map(function(r){
    var ph=function(a,t){return a.length?'<div class="lab">'+t+'</div><div class="row3">'+a.map(function(p){return '<img loading="lazy" src="'+pubUrl(thumbP(p))+'" data-p="'+esc(p)+'" alt="사진">'}).join('')+'</div>':''};
    var can=r.status==='wait'&&r.writer===who,bd=BADGE[r.status]||BADGE.wait,op=!!open_[r.id];
    var sum=esc(r.places.join('·'))+(r.detail?' <em>'+esc(r.detail)+'</em>':'')+' · '+esc(r.content);
    var out='<div class="rec"><button class="hd" data-tog="'+r.id+'" aria-expanded="'+op+'"><div class="l1"><span>'+fmt(r.started_at)+(r.ended_at?'':' · 진행 중')+'</span><span class="r"><span class="badge '+bd[0]+'">'+bd[1]+'</span><span class="arw">'+(op?'▲':'▼')+'</span></span></div><div class="l2">'+sum+'</div></button>';
    if(op)out+='<div class="bd"><div class="top" style="margin-top:8px"><span>'+fmt(r.started_at)+(r.ended_at?' ~ '+fmt(r.ended_at):' ~ 진행 중')+'</span></div>'
      +'<div class="ct">'+esc(r.places.join('·'))+(r.detail?' · '+esc(r.detail):'')+'\n'+esc(r.content)+(r.rail?'<span class="tag">난간대</span>':'')+'</div><div class="who">요청 '+esc([r.co,r.nm,r.ti].filter(Boolean).join(' '))+' · 작성 '+esc(r.writer)+'</div>'+ph(r.before_photos,'작업 전')+ph(r.after_photos,'작업 후')
      +(!r.ended_at?'<div class="acts"><button class="btn pri" data-act="res" data-id="'+r.id+'">결과 올리기</button></div>':'')+(can?'<div class="acts"><button class="btn" data-act="edit" data-id="'+r.id+'">수정</button><button class="btn del" data-act="del" data-id="'+r.id+'">삭제</button></div>':'')+'</div>';
    return out+'</div>'}).join('');
  if(hasMore)h+='<button class="btn more" id="moreBtn">더 보기 (20건)</button>';
  $('list').innerHTML=h}
$('list').addEventListener('click',function(e){
  if(e.target.closest('#moreBtn')){loadMore();return}
  var bt=e.target.closest('button[data-act]');
  if(bt){var id=bt.dataset.id,r=rows.filter(function(x){return x.id===id})[0];if(!r)return;
    if(bt.dataset.act==='res'){openRes(r);return}
    if(bt.dataset.act==='edit'){api('/rest/v1/requests?select=*&id=eq.'+id).then(function(d){var f=d&&d[0];
      if(!f||f.status!=='wait'){alert('이미 확인 중이거나 일지에 반영되어 고칠 수 없습니다.');loadList(true);return}
      loadForm(f);goTab('pgUp')}).catch(function(){alert('불러오지 못했습니다. 인터넷 연결을 확인해 주세요.')})}
    else if(confirm('이 기록을 지울까요?\n(사진도 함께 지워집니다)')){
      api('/rest/v1/requests?id=eq.'+id+'&status=eq.wait',{method:'DELETE',headers:{Prefer:'return=representation'}}).then(function(d){
        if(!d||!d.length){alert('이미 확인 중이거나 일지에 반영되어 지울 수 없습니다.');return loadList(true)}
        delete open_[id];return removeFiles(r.before_photos.concat(r.after_photos)).then(function(){return loadList(true)})
      }).catch(function(){alert('지우지 못했습니다. 인터넷 연결을 확인해 주세요.')})}
    return}
  var tg=e.target.closest('[data-tog]');
  if(tg){var k=tg.dataset.tog;if(open_[k])delete open_[k];else open_[k]=1;var y=window.scrollY;renderList();window.scrollTo(0,y);return}
  var im=e.target.closest('img');if(im)openBig(pubUrl(im.dataset.p))});

/* ---------- 진행 중 요청에 결과 올리기 ---------- */
function openRes(r){
  api('/rest/v1/requests?select=*&id=eq.'+r.id).then(function(d){var f=d&&d[0];
    if(!f||f.ended_at){alert('이미 완료 처리된 기록입니다.');loadList(true);return}
    resRow=f;R.length=0;R.draw();$('rNote').value='';$('errR').textContent='';
    $('rD').value=today();timeOpts($('rT'),nowT());
    $('resInfo').innerHTML='<b>'+esc(f.places.join('·'))+(f.detail?' · '+esc(f.detail):'')+'</b><br>'+esc(f.content)+'<br><span style="color:var(--mute)">시작 '+fmt(f.started_at)+' · 작성 '+esc(f.writer)+'</span>';
    goTab('pgRes')}).catch(function(){alert('불러오지 못했습니다. 인터넷 연결을 확인해 주세요.')})}
$('resCancel').onclick=function(){resRow=null;goTab('pgMine')};
$('resSend').onclick=function(){
  if(resBusy||!resRow)return;
  if(!$('rD').value){$('errR').textContent='작업 완료 날짜를 넣어 주세요.';return}
  if(!R.length){$('errR').textContent='작업 후 사진을 한 장 이상 올려 주세요.';return}
  resBusy=true;$('resSend').disabled=true;$('errR').textContent='';$('resSend').textContent='올리는 중… (창을 닫지 마세요)';
  var id=resRow.id,n=0,todo=R.filter(function(it){return !it.p});
  todo.reduce(function(pr,it){return pr.then(function(){
    var p=id+'/'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36)+'.jpg';
    return upload(p,it.d).then(function(){return upload(thumbP(p),it.t)}).then(function(){it.p=p;n++;$('resSend').textContent='올리는 중… '+n+'/'+todo.length})})},Promise.resolve())
  .then(function(){
    return api('/rest/v1/rpc/add_result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      p_id:id,p_ended:$('rD').value+'T'+$('rT').value+':00',p_after:resRow.after_photos.concat(R.map(function(x){return x.p})),p_note:$('rNote').value.trim()})})})
  .then(function(c){
    if(!c){alert('이미 완료 처리된 기록이라 결과를 올릴 수 없습니다.');resRow=null;goTab('pgMine');return}
    resRow=null;alert('결과를 올렸습니다.\n확인 후 일지에 반영됩니다.');goTab('pgMine')})
  .catch(function(){$('errR').textContent='올리지 못했습니다. 인터넷 연결을 확인하고 「결과 올리기」를 다시 눌러 주세요. (올라간 사진부터 이어서 올립니다)'})
  .then(function(){resBusy=false;$('resSend').disabled=false;$('resSend').textContent='결과 올리기'})};

/* 새 버전 자동 확인: 서버 파일의 ETag가 지난번과 다르면 한 번 새로 불러옴 (폰이 예전 화면을 붙잡고 있는 것 방지) */
(function(){try{fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){var t=r.headers.get('etag')||r.headers.get('last-modified');if(!t)return;var o=lsGet('jr-ver');lsSet('jr-ver',t);
  if(o&&o!==t&&!/[?&]v=/.test(location.search))location.replace(location.pathname+'?v='+Date.now())}).catch(function(){})}catch(e){}})();
setWho(lsGet('jr-who')||'');
</script>
</body>
