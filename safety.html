<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안전 개선</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf9f6">
<link rel="apple-touch-icon" href="safety-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="safety-192.png">
<link rel="manifest" href="safety.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안전 개선">
<style>
:root{--bg:#faf9f6;--paper:#fff;--ink:#16253b;--mute:#6b7684;--line:#d9d5cb;--soft:#ece9e1;--acc:#002c5f;--accink:#fff;--done:#1f7a4d;--open:#b5651d;--head:#f3f1ea;--g:16px;--fs-s:12px;--fs-m:14px;--fs-b:15px;--fs-t:20px;--lh:22px;--w:720px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15181b;--paper:#1f2428;--ink:#e8ebee;--mute:#8d97a1;--line:#3a4148;--soft:#2a3036;--acc:#7fb0ff;--accink:#0b1626;--done:#4cc38a;--open:#e0a060;--head:#2a3036;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button,.st,.tag,.seg button{white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) max(var(--g),calc((100% - var(--w))/2 + var(--g))) 0}
.brand{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:300;letter-spacing:.3em;font-size:var(--fs-s);color:var(--acc)}
.brand b{font-weight:800}
.brand span{font-family:inherit;letter-spacing:.08em;font-weight:500;margin-left:6px;color:var(--mute)}
.menu{display:flex;gap:22px;margin-top:6px}
.menu a,.menu b{display:block;padding:8px 0 9px;font-size:var(--fs-b);text-decoration:none;color:var(--mute);border-bottom:2px solid transparent;font-weight:600}
.menu b{color:var(--ink);border-bottom-color:var(--acc)}
/* 폰: 「정정 일지」「안전 개선」 둘 다(앱 안에서 전환). 컴퓨터(넓은 화면)에서는 「정정 일지」가 PC 보기 화면으로 이동 */
.menu .pc{display:none}
.menu .mob{display:block}
.menu a.on{color:var(--ink);border-bottom-color:var(--acc)}
@media (min-width:900px){.menu .pc{display:block}.menu .mob{display:none}}
.wrap{max-width:var(--w);margin:0 auto;padding:14px var(--g) 40px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:var(--fs-m)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 14px;font-size:var(--fs-m);line-height:20px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink)}
select.sel{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:6px 10px;font-size:var(--fs-m);line-height:20px}
.who{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:6px 10px;font-size:var(--fs-m);line-height:20px;cursor:pointer}
.sum{display:flex;align-items:baseline;gap:18px;margin:14px 0 4px;font-size:var(--fs-m)}
.sum b{font-size:var(--fs-t);margin-right:4px}
.list{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.it{display:flex;gap:12px;padding:12px;border-top:1px solid var(--soft);text-decoration:none;color:inherit;align-items:flex-start}
.it:first-child{border-top:0}
.th{width:64px;height:64px;flex:none;border-radius:6px;background:var(--head);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.th img{width:100%;height:100%;object-fit:cover}
.it .tx{flex:1;min-width:0}
.it .t{font-size:var(--fs-b);line-height:var(--lh);font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.st{font-size:var(--fs-s);font-weight:700;white-space:nowrap;line-height:var(--lh)}
.st.open{color:var(--open)}.st.done{color:var(--done)}
.st:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.empty{padding:28px 12px;text-align:center;color:var(--mute)}
.back{display:inline-block;margin:2px 0 8px;font-size:var(--fs-m);color:var(--mute);text-decoration:none}
h1{font-size:var(--fs-t);line-height:28px;margin:6px 0 8px}
.meta{font-size:var(--fs-m);line-height:var(--lh);color:var(--mute)}
.meta span{white-space:nowrap}
.meta span+span:before{content:" · "}
.it .meta{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:var(--fs-s);border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--mute)}
.body{white-space:pre-wrap;margin-top:10px;font-size:var(--fs-b);line-height:24px;text-wrap:pretty}
.pics{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pics img{width:104px;height:104px;object-fit:cover;border-radius:6px;background:var(--head);cursor:zoom-in}
.pics a.pdf{width:104px;height:104px;border-radius:6px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#b3261e;font-weight:800;font-size:15px}
.pics a.pdf span{font-size:11px;color:var(--mute);font-weight:400}
.sec{font-size:var(--fs-m);font-weight:700;color:var(--mute);margin:24px 0 8px;letter-spacing:.02em}
.box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--soft)}
.step{position:relative;padding-bottom:16px}
.step:before{content:"";position:absolute;left:-18px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--acc)}
.step.fin:before{background:var(--done);border-color:var(--done)}
.step .d{font-size:var(--fs-m);line-height:var(--lh);font-weight:700;color:var(--acc)}
.kv{display:grid;grid-template-columns:4.6em 1fr;gap:2px 10px;margin-top:6px;font-size:var(--fs-m);line-height:var(--lh)}
.kv em{font-style:normal;color:var(--mute)}
.kv span{min-width:0}
.step.fin .d{color:var(--done)}
.notes{margin-top:8px;border-top:1px dashed var(--line)}
.note{padding:8px 0;border-bottom:1px dashed var(--soft)}
.note .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--fs-m);line-height:var(--lh)}
.note .h b{font-weight:700}
.note .w{color:var(--mute);font-size:var(--fs-s);white-space:nowrap}
.lkd{color:#d6455d;margin-left:2px}
.nact{margin-top:2px;display:flex;gap:14px}
.nact button{border:0;background:none;padding:6px 0;font-size:var(--fs-s);color:var(--mute);cursor:pointer;text-decoration:underline}
.nact .lkb{text-decoration:none;font-size:var(--fs-m)}.nact .lkb.on{color:#d6455d}
.nedit{display:flex;gap:6px;margin-top:4px}.nedit input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px;font-size:var(--fs-m)}
.note .tx2{font-size:var(--fs-m);line-height:21px;white-space:pre-wrap}
.nin{display:flex;gap:6px;margin-top:8px}
.nin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;font-size:var(--fs-m)}
.nin button,.btn{border:1px solid var(--acc);background:var(--acc);color:var(--accink);border-radius:6px;padding:8px 12px;font-size:var(--fs-m);cursor:pointer;white-space:nowrap}
.btn.ghost{background:none;color:var(--acc)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.kpi div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:var(--fs-t);line-height:28px}
.kpi span{font-size:var(--fs-s);color:var(--mute)}
.hb{display:grid;grid-template-columns:84px 1fr 54px;align-items:center;gap:8px;font-size:var(--fs-m);padding:4px 0}
.hb .tr{height:12px;background:var(--soft);border-radius:2px;overflow:hidden;display:flex}
.hb .tr i{display:block;height:100%}
.lg{display:flex;gap:14px;font-size:var(--fs-s);color:var(--mute);margin-bottom:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.c-done{background:var(--done)}.c-open{background:var(--open)}
svg text{fill:var(--mute);font-size:10px}
table.t{width:100%;border-collapse:collapse;font-size:var(--fs-m)}
table.t td,table.t th{padding:8px 4px;vertical-align:top;border-bottom:1px solid var(--soft);text-align:left}
table.t th{color:var(--mute);font-weight:600}
table.t td.n{text-align:right;white-space:nowrap}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{max-width:96vw;max-height:92vh;display:block}
#dlg{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0}
#dlgStrip{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#dlgStrip::-webkit-scrollbar{display:none}
#dlgStrip img{flex:0 0 100%;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;scroll-snap-align:center;scroll-snap-stop:always}
#dlgCnt{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);border-radius:14px;padding:3px 12px;font-size:14px;pointer-events:none}
#dlgX{position:absolute;top:8px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
.dnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:8px;background:rgba(0,0,0,.45);color:#fff;font-size:34px;cursor:pointer;display:none}
#dlgP{left:8px}#dlgN{right:8px}
@media (hover:hover) and (pointer:fine){.dnav{display:block}}
.pick{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:16px;width:min(340px,92vw);color:var(--ink)}
.pick h2{font-size:var(--fs-b);margin:0 0 4px}
.pick .g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.pick .g button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 6px;text-align:left;cursor:pointer}
.pick .g button small{color:var(--mute);margin-left:4px}
.err{color:#b3261e;font-size:var(--fs-m);margin-top:6px}
.load{padding:40px 0;text-align:center;color:var(--mute)}

.brandrow{display:flex;align-items:center;justify-content:space-between}
.bell{position:relative;border:0;background:none;color:var(--mute);padding:4px 2px;cursor:pointer;line-height:0}
.bell i{display:none;position:absolute;top:3px;right:0;width:8px;height:8px;border-radius:50%;background:var(--open)}
.bell.on{color:var(--acc)}.bell.on i{display:block;background:var(--done)}
.bo{display:flex;gap:8px;align-items:flex-start;padding:8px 0;font-size:var(--fs-m);line-height:20px}
.bo input{margin-top:3px;flex:none}

/* ---------- 정정 일지(폰) ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 calc(var(--g)*-1);padding-left:var(--g);padding-right:var(--g);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:5px 12px;font-size:var(--fs-m);color:var(--mute);cursor:pointer}
.chips button small{margin-left:3px;opacity:.7}
.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.srch{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:6px 10px;font-size:var(--fs-m);line-height:20px}
.it.j{display:flex}.it.j .meta{display:block}
.it.j .t{-webkit-line-clamp:2}
.rail{font-size:var(--fs-s);font-weight:700;color:var(--done);margin-left:6px}
.jph{display:grid;gap:6px;margin-top:10px;grid-template-columns:1fr 1fr}
.jph.n1{grid-template-columns:1fr}
.jph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--head);cursor:zoom-in;display:block}
.jph.n1 img{aspect-ratio:auto;max-height:70vh;object-fit:contain}
@media (min-width:900px){.it.j{display:flex}}

@media (max-width:899px){input,select,textarea{font-size:16px!important}}
/* 사진 배치(폰·PC 공통): 1장 크게, 2·4장 2열, 3·5장 이상 3열 */
@media screen{
 .pics{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}
 .pics.n1{grid-template-columns:1fr}
 .pics.n2,.pics.n4{grid-template-columns:1fr 1fr}
 .pics img,.pics a.pdf{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
 .pics.n1 img{aspect-ratio:auto;max-height:62vh;object-fit:contain;background:var(--head)}
 .pics a.pdf{font-size:13px}
}

/* ---------- 컴퓨터(넓은 화면) ---------- */
.pcOnly{display:none}
.pbrand{display:none}
.it .cc,.lhd{display:none}
.dgrid .col2>.sec:first-child{margin-top:24px}
.tb{gap:6px}
@media (min-width:900px){
 :root{--w:1280px;--fs-s:13px;--fs-m:15px;--fs-b:16px;--lh:24px}
 .pcOnly{display:inline-block}
 .dgrid{display:grid;grid-template-columns:minmax(420px,5fr) 6fr;gap:28px;align-items:start}
 .dgrid .col2>.sec:first-child{margin-top:0}
 .dgrid .col2{min-width:0}
 .pics img{width:150px;height:112px}
 .pics a.pdf{width:150px;height:112px}
 .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
 .kpi{grid-template-columns:repeat(5,1fr)}
}
@media (min-width:900px),print{
 .it{display:grid;grid-template-columns:96px minmax(0,1fr) 120px 110px 90px 80px 90px;align-items:center;gap:14px;padding:10px 16px}
 .it .meta{display:none}
 .it .cc{display:block;font-size:var(--fs-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .it .th{width:96px;height:72px}
 .lhd{display:grid;grid-template-columns:96px minmax(0,1fr) 120px 110px 90px 80px 90px;gap:14px;padding:8px 16px;background:var(--head);border-bottom:1px solid var(--line);font-size:var(--fs-s);font-weight:700;color:var(--mute)}
 .list{overflow:hidden}
}
.menu .tools{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:6px}
@media screen and (min-width:900px){
 .dgrid .col1{position:sticky;top:calc(var(--th,100px) + 14px);max-height:calc(100vh - var(--th,100px) - 28px);overflow:auto;scrollbar-width:thin}
 .dgrid .box{padding:18px 20px}
 .dgrid h1{font-size:22px;line-height:30px}
 .pics{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
 .pics.n1{grid-template-columns:1fr}
 .pics.n2,.pics.n4{grid-template-columns:1fr 1fr}
 .pics img,.pics a.pdf{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
 .pics.n1 img{aspect-ratio:auto;max-height:380px;object-fit:contain;background:var(--head)}
}
@media print{
 :root{--bg:#fff;--paper:#fff;--ink:#000;--mute:#444;--line:#999;--soft:#ccc;--head:#eee;--acc:#000;--done:#000;--open:#000;--fs-s:8pt;--fs-m:9pt;--fs-b:10pt;--fs-t:13pt;--lh:14pt;--w:none;color-scheme:light}
 body{font-size:10pt;background:#fff}
 .top,.np,.nin,.back,.pcOnly{display:none!important}
 .pbrand{display:block;text-align:right;font-size:8pt;letter-spacing:.12em;margin:0 0 4pt}
 .wrap{max-width:none;padding:0}
 .it,.step,.box,.hb,.kpi div{break-inside:avoid}
 .it{grid-template-columns:60px minmax(0,1fr) 72px 88px 44px 36px 54px;gap:8px;padding:6pt 8pt}
 .it .th{width:60px;height:45px}
 .lhd{grid-template-columns:60px minmax(0,1fr) 72px 88px 44px 36px 54px;gap:8px;padding:4pt 8pt}
 .pics img{width:28mm;height:21mm}
 .pics a.pdf{width:28mm;height:21mm}
 .dgrid{display:block}
 .g2{display:block}
 .kpi{grid-template-columns:repeat(5,1fr)}
 .tl:before{background:#ccc}
 .box,.list{border-radius:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

   (r.note?'<div class="meta" style="margin-top:12px">'+esc(r.note)+'</div>':'');
  window.scrollTo(0,0)}

/* ---------- 알림(웹 푸시): 정정 일지·안전 개선 새 글 ---------- */
var VAPID='BIOM1ER2dry7xMYenEDh1JfONxfNmHU5HFAEd4dorkdjlW93WtWLnEVd6y5_NkHpQIwWztI25WUzctqfDT_QDww';
function u8(b){var p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function pRpc(n,a){return fetch(JU+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:JK,Authorization:'Bearer '+JK,'Content-Type':'application/json'},body:JSON.stringify(a)}).catch(function(){throw new Error('인터넷 연결을 확인해 주세요')}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error('서버 오류: '+t)});return r.status===204?null:r.json().catch(function(){return null})})}
function pushOK(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function swReady(){return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready})}
function myName(){return lsGet('sv-name')||''}
function bellNameShow(){$('bellName').textContent=myName()?'이름: '+myName()+' (내가 올린 글은 알림이 오지 않습니다)':'이름을 고르면 내가 올린 글은 알림이 오지 않습니다.'}
function bellMark(on){$('bBell').classList.toggle('on',!!on)}
function bellOpen(){
  var m=$('bellMsg'),err=$('bellErr');err.textContent='';$('bellTest').hidden=true;$('bellOpts').hidden=false;$('bellSave').hidden=false;$('bellSave').textContent='알림 켜기';$('bJj').checked=true;$('bSf').checked=true;
  bellNameShow();$('bellDlg').showModal();
  if(!pushOK()){$('bellOpts').hidden=true;$('bellSave').hidden=true;
    m.textContent=isIOS()?'아이폰은 Safari에서 「공유 → 홈 화면에 추가」로 만든 앱을 열어야 알림을 받을 수 있습니다. 홈 화면의 「안전 개선」 앱에서 다시 눌러 주세요.':'이 브라우저는 알림 기능을 지원하지 않습니다.';return}
  if(Notification.permission==='denied'){$('bellOpts').hidden=true;$('bellSave').hidden=true;m.textContent='알림이 차단되어 있습니다. 폰 설정에서 이 앱의 알림을 허용한 뒤 다시 열어 주세요.';return}
  m.textContent='켜면 이 폰으로 새 글 알림이 옵니다. 항목별로 끌 수 있습니다.';
  swReady().then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
    if(!sub){return}
    return pRpc('push_get',{p_endpoint:sub.endpoint}).then(function(v){
      if(v){$('bJj').checked=!!v.jj;$('bSf').checked=!!v.sf;$('bellSave').textContent='저장';$('bellTest').hidden=false;m.textContent='이 폰에 알림이 켜져 있습니다. 항목을 끄고 저장하면 그 알림은 오지 않습니다. 둘 다 끄면 알림이 완전히 꺼집니다.'}})
  }).catch(function(e){err.textContent=e.message})}
$('bBell').onclick=bellOpen;
$('bellWho').onclick=function(){(D.viewers?Promise.resolve():load()).then(function(){pickName(function(){bellNameShow();swReady().then(function(r){return r.pushManager.getSubscription()}).then(function(sub){if(sub)pRpc('push_set_name',{p_endpoint:sub.endpoint,p_name:myName()}).catch(function(){})})})}).catch(function(e){$('bellErr').textContent=e.message})};
$('bellClose').onclick=function(){$('bellDlg').close()};
$('bellSave').onclick=function(){var err=$('bellErr'),jj=$('bJj').checked,sf=$('bSf').checked,b=$('bellSave');err.style.color='';
  function st(t){err.style.color='';err.textContent=t}
  function tmo(pr,ms,msg){return new Promise(function(ok,no){var t=setTimeout(function(){no(new Error(msg))},ms);pr.then(function(v){clearTimeout(t);ok(v)},function(e){clearTimeout(t);no(e)})})}
  b.disabled=true;st('1/4 알림 허용 확인 중… (허용 창이 뜨면 「허용」을 눌러 주세요)');
  var rp;try{rp=Promise.resolve(Notification.requestPermission())}catch(x){rp=Promise.reject(x)}
  tmo(rp,20000,'허용 창이 뜨지 않았습니다. 폰 설정 → 앱 → 이 앱(Chrome 또는 안전 개선) → 알림을 켠 뒤 다시 눌러 주세요. (현재 상태: '+Notification.permission+')')
  .then(function(p){if(p!=='granted')throw new Error('알림이 허용되지 않았습니다. (상태: '+p+') 폰 설정에서 이 앱의 알림을 허용해 주세요.');st('2/4 알림 준비 중…');return tmo(swReady(),10000,'서비스 워커가 준비되지 않았습니다. 앱을 완전히 닫았다 다시 열어 주세요.')})
  .then(function(reg){st('3/4 이 폰 등록 중…');return reg.pushManager.getSubscription().then(function(sub){return sub||tmo(reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)}),20000,'푸시 등록이 응답하지 않습니다. 인터넷·절전 설정을 확인해 주세요.')})})
  .then(function(sub){var j=sub.toJSON();st('4/4 서버에 저장 중…');
    return pRpc('push_save',{p_endpoint:sub.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_jj:jj,p_sf:sf,p_name:myName()}).then(function(){
      if(!jj&&!sf){return sub.unsubscribe().then(function(){lsSet('sv-push','');bellMark(false);$('bellDlg').close()})}
      lsSet('sv-push','1');bellMark(true);$('bellSave').textContent='저장';$('bellTest').hidden=false;err.style.color='var(--done)';err.textContent='저장했습니다. 「시험 알림」을 눌러 확인해 보세요.'})})
  .catch(function(e){err.style.color='';err.textContent=(e&&(e.name?e.name+': ':'')+e.message)||'알 수 없는 오류'}).then(function(){b.disabled=false})};
$('bellTest').onclick=function(){var err=$('bellErr');err.style.color='';err.textContent='보내는 중…';
  swReady().then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){if(!sub)throw new Error('알림이 켜져 있지 않습니다.');
    return fetch(JU+'/functions/v1/push-send',{method:'POST',headers:{'Content-Type':'application/json',apikey:JK,Authorization:'Bearer '+JK},body:JSON.stringify({action:'test',endpoint:sub.endpoint})})})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error==='not subscribed'?'서버에 등록되어 있지 않습니다. 「저장」을 눌러 주세요.':'보내지 못했습니다.');err.style.color='var(--done)';err.textContent='보냈습니다. 잠시 뒤 알림이 옵니다.'})})
  .catch(function(e){err.style.color='';err.textContent=e.message})};
(function(){bellMark(lsGet('sv-push')==='1');
  if(pushOK()&&Notification.permission==='granted'){swReady().then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){bellMark(!!sub);lsSet('sv-push',sub?'1':'');if(sub&&myName())pRpc('push_set_name',{p_endpoint:sub.endpoint,p_name:myName()}).catch(function(){})}).catch(function(){})}})();

/* 새 판 확인: 서버 파일이 바뀌었으면(ETag) 한 번 새로 불러옴 — 홈 화면 앱이 옛 화면을 붙잡는 문제 방지 */
(function(){try{fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){var t=r.headers.get('etag')||r.headers.get('last-modified');if(!t)return;var o=lsGet('sv-ver');lsSet('sv-ver',t);
  if(o&&o!==t&&!/[?&]v=/.test(location.search))location.replace(location.pathname+'?v='+Date.now()+location.hash)}).catch(function(){})}catch(e){}})();
